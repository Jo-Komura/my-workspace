<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アライグマの拭き拭き</title>
<link rel="stylesheet" href="style.css">
<script src="../shared/settings.js"></script>
</head>
<body>

<div id="stage">
  <div id="bg"></div>

  <!-- お掃除屋さん（アライグマ）＝舞台の左に立つ。飾りなのでタップは拭きカードへ透過。 -->
  <img id="cleaner" src="images/cleaner.png" alt="">

  <!-- 拭き拭きカード（曇った窓／ほこりの額）。サイズは layout() がpxで決める。 -->
  <div id="card">
    <div id="plate">
      <img id="animal" src="" alt="">      <!-- 下にいる動物（拭くと現れる） -->
      <canvas id="dirt"></canvas>          <!-- よごれ／くもり（こすると消える） -->
    </div>
  </div>

  <a id="back" href="../index.html"><img src="../shared/images/btn-back.png" alt="もどる"></a>
  <div id="score">✨ 0</div>
  <div id="startray"></div>           <!-- 集めた星（5個でクリア）。スロットはJSで作る -->
  <button id="gear" aria-label="設定"><img src="../shared/images/btn-settei.png" alt="設定"></button>

  <div id="panel">
    <div class="sheet">
      <h2>設定</h2>
      <div class="row">
        <span>拭く量（1=かんたん）</span>
        <div class="seg" id="seg-wipe"></div>
      </div>
      <button class="close" id="panel-close">閉じる</button>
    </div>
  </div>

  <!-- 完成演出（星5個でクリア。できたー！画像が動きながら出る） -->
  <div id="clear"><img class="clear-img" src="../shared/images/dekita.png" alt="できたー！"></div>

  <!-- タイトル画面（各ゲーム共通：もどる・設定・はじめる） -->
  <div id="title">
    <img id="titlebg" src="images/title-bg.jpg" alt="アライグマの拭き拭きお掃除">
    <a id="t-back" href="../index.html"><img src="../shared/images/btn-back.png" alt="もどる"></a>
    <button id="t-gear" aria-label="せってい"><img src="../shared/images/btn-settei.png" alt="設定"></button>
    <div id="start-hint">タップで スタート</div>
  </div>
</div>

<script>
/* =======================================================================
   アライグマの拭き拭き ― 骨組み v0.1
   - 中身は「こすって きれいにする」遊び。
     ＝Canvasの destination-out（Flashの消しゴム）で“よごれ”を消すと
       下にかくれた どうぶつが ピカッと現れる。
   - 「はるひ基準」：罰なし・ゲームオーバーなし・スコアは増えるだけ・触るだけ。
   - 背景の絵は後から差し込む（下の BG_IMG）。無くても仮背景で遊べる。
   - どうぶつは ANIMALS 配列に足すだけで増やせる（今は10匹：キリン/ゾウ/ウマ/ネコ/イヌ/ウサギ/トリ/サカナ＋借り物のクマ/あざらし）。
   ======================================================================= */

/* ---- 差し替えポイント ------------------------------------------------- */
var BG_IMG = 'images/bg.jpg';     // お掃除のお部屋の背景（無ければ仮のグラデ）

/* 拭くと現れる どうぶつ（白背景の絵）。後で増やすときはここに1行足すだけ。 */
var ANIMALS = [
  'images/giraffe.jpg',           // キリン
  'images/elephant.jpg',          // ゾウ
  'images/horse.jpg',             // ウマ
  'images/cat.jpg',               // ネコ
  'images/dog.jpg',               // イヌ
  'images/rabbit.jpg',            // ウサギ
  'images/bird.jpg',              // トリ
  'images/fish.jpg',              // サカナ
  'images/bear.jpg',              // クマ（ケーキ屋さんから借り物）
  'images/seal.jpg'               // あざらし（叩かれてない方・借り物）
];
/* ---------------------------------------------------------------------- */

var stage  = document.getElementById('stage');
var bgEl   = document.getElementById('bg');
var card   = document.getElementById('card');
var plate  = document.getElementById('plate');
var animal = document.getElementById('animal');
var cv     = document.getElementById('dirt');
var ctx    = cv.getContext('2d');
var scoreEl = document.getElementById('score');

var score = 0;
var GOAL = 5;                      // 星を何個集めたらクリアか
var stars = 0;                     // 集めた星の数
var starEls = [];                  // 星トレイのスロット
var cleared = false;               // クリア演出中はtrue
var setting = { wipe: 3 };         // 親の調節：拭く量（1=かんたん〜5=しっかり）。このゲームの初期値は3＝70%
/* 拭く量ごとの「ピカピカ完成」しきい値（消えた割合）。小さいほど早く完成。
   1=50% / 2=60% / 3=70% / 4=80% / 5=90%。 */
var WIPE_THRESHOLD = [0.50, 0.60, 0.70, 0.80, 0.90];

var started = false;               // タイトルの「はじめる」で true
var wiping  = false;               // 指を下ろしている間 true
var canClean = false;              // 完成判定を受け付けるか（演出中は false）
var animalIdx = -1;
var lastX = 0, lastY = 0;
var lastCW = 0, lastCH = 0;        // 直前の canvas 実寸（変化時だけ塗り直す）

/* ---- 舞台の縦横比 ----------------------------------------------------
   - 背景画像(bg.jpg)があれば、それを本物の背景にして縦横比も合わせる。
   - まだ無いうちは、タイトル絵の縦横比を舞台に使う＝他のゲームと同じく
     「絵の全体が見える」収まりにする（画面いっぱいに拡大してはみ出さない）。 */
var ASPECT = 0;
(function detectBg() {
  // タイトル絵の縦横比をまず使う（背景が来るまでの基準）
  var titleImg = document.getElementById('titlebg');
  var useTitle = function () {
    if (titleImg.naturalWidth && !document.body.classList.contains('has-bg')) {
      ASPECT = titleImg.naturalHeight / titleImg.naturalWidth;
      layout();
    }
  };
  if (titleImg.complete) useTitle(); else titleImg.onload = useTitle;

  // 本物の背景があれば、そちらを優先（縦横比も上書き）
  var im = new Image();
  im.onload = function () {
    document.body.classList.add('has-bg');
    bgEl.style.backgroundImage = 'url("' + BG_IMG + '")';
    ASPECT = im.naturalHeight / im.naturalWidth;
    layout();
  };
  im.src = BG_IMG;                 // 無ければ onload は呼ばれず仮グラデのまま
})();

/* ---- 舞台の寸法 ------------------------------------------------------ */
/* 背景画像がある時は縦横比で中央に収める。無い時は画面いっぱい。 */
function layout() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var w, h, left, top;
  if (ASPECT) {
    w = vw; h = w * ASPECT;
    if (h > vh) { h = vh; w = h / ASPECT; }
    if (w > 1200) { w = 1200; h = w * ASPECT; }
    left = (vw - w) / 2; top = (vh - h) / 2;
  } else {
    w = vw; h = vh; left = 0; top = 0;
  }
  stage.style.width  = w + 'px';
  stage.style.height = h + 'px';
  stage.style.left = left + 'px';
  stage.style.top  = top + 'px';
  sizeCard(w, h);
}
window.addEventListener('resize', layout);

/* カード（拭く面）の大きさを舞台に合わせて決める。
   舞台の幅・高さの小さい方を基準にして、はみ出さず・指で拭きやすい大きさに。 */
function sizeCard(w, h) {
  var side = Math.min(w * 0.56, h * 0.72);   // 右側に収まる大きさ（左はお掃除屋さんのスペース）
  card.style.width  = side + 'px';
  card.style.height = side + 'px';
  // 中の白い面の実寸を canvas に反映（フチ＝paddingぶん小さい）。
  var cw = Math.round(plate.clientWidth);
  var chh = Math.round(plate.clientHeight);
  if (cw < 1 || chh < 1) return;
  if (cw !== lastCW || chh !== lastCH) {
    cv.width = cw; cv.height = chh;     // 内部解像度＝表示サイズ（座標が1:1）
    lastCW = cw; lastCH = chh;
    if (started) paintDirt();           // 大きさが変わったら塗り直す
  }
}

/* ---- よごれ／くもりを canvas いっぱいに塗る --------------------------- */
function paintDirt() {
  var w = cv.width, h = cv.height;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, w, h);
  // ベース＝ほこりっぽい温かいグレー
  ctx.fillStyle = '#cdbfa6';
  ctx.fillRect(0, 0, w, h);
  // 濃いシミをいくつか（“よごれてる”感）。乱数で毎回ちがう。
  for (var i = 0; i < 14; i++) {
    var x = Math.random() * w, y = Math.random() * h;
    var r = (0.10 + Math.random() * 0.16) * w;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(150,134,104,0.55)');
    g.addColorStop(1, 'rgba(150,134,104,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  // 斜めの拭き跡っぽい明るいスジ（汚れ窓の質感）
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = Math.max(6, w * 0.03);
  for (var k = -1; k < 3; k++) {
    ctx.beginPath();
    ctx.moveTo(k * w * 0.4, h);
    ctx.lineTo(k * w * 0.4 + w * 0.7, 0);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'destination-out';   // 以降は“消しゴム”
}

/* ---- 指でこすった所を消す（destination-out） ------------------------- */
function eraseAt(x, y) {
  var r = cv.width * 0.11;          // 指サイズの消しゴム
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
/* 前の点と今の点の間も線でつなぐ（速く動かしても穴が空かない） */
function eraseLine(x0, y0, x1, y1) {
  var r = cv.width * 0.11;
  ctx.lineWidth = r * 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}

/* canvas上の座標へ変換（表示サイズと内部解像度のズレも吸収） */
function toCanvas(clientX, clientY) {
  var rect = cv.getBoundingClientRect();
  var sx = cv.width / rect.width;
  var sy = cv.height / rect.height;
  return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
}

function onDown(ev) {
  if (!started || !canClean) return;
  if (document.getElementById('panel').classList.contains('open')) return;
  ev.preventDefault();
  var p = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
  var c = toCanvas(p.clientX, p.clientY);
  wiping = true; lastX = c.x; lastY = c.y;
  eraseAt(c.x, c.y);
  scheduleCheck();
}
function onMove(ev) {
  if (!wiping) return;
  ev.preventDefault();
  var p = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
  var c = toCanvas(p.clientX, p.clientY);
  eraseLine(lastX, lastY, c.x, c.y);
  lastX = c.x; lastY = c.y;
  noteWipeMove();                   // こすり音：動いている間だけ鳴らす
  if (Math.random() < 0.18) bubbleAt(c.x, c.y);   // たまにシャボンのキラッ
  scheduleCheck();
}
function onUp() { wiping = false; stopWipeSound(); }

cv.addEventListener('touchstart', onDown, { passive: false });
cv.addEventListener('touchmove',  onMove, { passive: false });
cv.addEventListener('touchend',   onUp);
cv.addEventListener('mousedown',  onDown);
cv.addEventListener('mousemove',  onMove);
window.addEventListener('mouseup', onUp);

/* ---- こすり音（goshi.mp3）：指を動かして“こすっている間だけ”
   「鳴らす→鳴り終わったら0.5秒あけて→また鳴らす」を繰り返す。指を止めると止まる。
   SEの音量・ミュートに従う。間隔は WIPE_GAP、止まった判定は WIPE_IDLE で調整。 */
var WIPE_GAP  = 500;    // 1回鳴り終わってから次までの間（ミリ秒）
var WIPE_IDLE = 180;    // この時間こすりが無ければ「止まった」とみなす（ミリ秒）
var wipeAudio = null, wipeGapTimer = null, wipeActive = false, lastMoveAt = 0;
function nowMs() { return (window.performance && performance.now) ? performance.now() : (+new Date()); }
function getWipe() {
  if (!wipeAudio) {
    wipeAudio = new Audio(SE_DIR + 'goshi.mp3'); wipeAudio.preload = 'auto';
    wipeAudio.addEventListener('ended', function () {
      // 鳴り終わった時、まだこすっていれば間をあけて次へ。止まっていれば終了。
      if (!wipeActive) return;
      if (!wiping || nowMs() - lastMoveAt > WIPE_IDLE) { wipeActive = false; return; }
      scheduleNextWipe();
    });
  }
  return wipeAudio;
}
function playWipeOnce() {
  if (!wiping) { wipeActive = false; return; }
  try {
    var a = getWipe();
    a.volume = (window.HTBSettings ? HTBSettings.seVolume() : 1);
    a.currentTime = 0;
    var p = a.play(); if (p && p.catch) p.catch(function(){});
  } catch (e) {}
}
function scheduleNextWipe() {
  if (wipeGapTimer) return;
  wipeGapTimer = setTimeout(function () {
    wipeGapTimer = null;
    // 間をあけている内に止まっていたら鳴らさない（こすっている時だけ続く）
    if (!wiping || nowMs() - lastMoveAt > WIPE_IDLE) { wipeActive = false; return; }
    playWipeOnce();
  }, WIPE_GAP);
}
/* こすり（onMove）から呼ぶ：動いている印をつけ、止まっていたら鳴らし始める。 */
function noteWipeMove() {
  lastMoveAt = nowMs();
  if (!wipeActive) { wipeActive = true; playWipeOnce(); }
}
function stopWipeSound() {
  wipeActive = false;
  if (wipeGapTimer) { clearTimeout(wipeGapTimer); wipeGapTimer = null; }
  // 今鳴っている音は最後まで鳴らす（次を予約しないだけ＝ぶつ切りにしない）
}

/* ---- どれくらい消えたか（透明ピクセルの割合）を間引きで数える -------- */
function wipedFraction() {
  var w = cv.width, h = cv.height;
  if (w < 1 || h < 1) return 0;
  var data = ctx.getImageData(0, 0, w, h).data;
  var step = 6, total = 0, clear = 0;          // 6pxおきに見る＝古い端末でも軽い
  for (var y = 0; y < h; y += step) {
    for (var x = 0; x < w; x += step) {
      total++;
      if (data[(y * w + x) * 4 + 3] < 25) clear++;
    }
  }
  return total ? clear / total : 0;
}

/* 拭くたびに毎回数えると重いので、少し間隔をあけて判定する。 */
var checkTimer = null;
function scheduleCheck() {
  if (checkTimer || !canClean) return;
  checkTimer = setTimeout(function () {
    checkTimer = null;
    if (!canClean) return;
    if (wipedFraction() >= WIPE_THRESHOLD[setting.wipe - 1]) cleaned();
  }, 220);
}

/* ---- ピカピカ完成！＝スコア+1・キラキラ・ポンッ → 次の どうぶつ ------ */
function cleaned() {
  if (!canClean) return;
  canClean = false; wiping = false; stopWipeSound();
  // 残りのよごれもサッと消して、まるごとピカピカに。
  ctx.clearRect(0, 0, cv.width, cv.height);
  score += 1;
  scoreEl.textContent = '✨ ' + score;
  sparkleBurst();
  se('clean');                        // 1枚きれいになった音（新しい clean.mp3）
  card.classList.add('clean');
  setTimeout(function () { card.classList.remove('clean'); }, 520);
  flyStar();                          // 星がカード→頭の上のトレイへ飛ぶ（着地で点灯→次/クリア）
}

/* ---- 星トレイ（5個でクリア） ---------------------------------------- */
function buildStarTray() {
  var tray = document.getElementById('startray');
  tray.innerHTML = '';
  starEls = [];
  for (var i = 0; i < GOAL; i++) {
    var s = document.createElement('div');
    s.className = 'sslot';
    s.innerHTML = '<img src="images/star.png" alt="">';
    tray.appendChild(s);
    starEls.push(s);
  }
}
/* きれいになった星が、カードからお掃除屋さんの頭の上のトレイへ飛んで収まる演出。
   着地でスロット点灯。5個目ならクリア、まだなら次のどうぶつへ。 */
function flyStar() {
  var targetIdx = stars;
  stars += 1;
  var slot = starEls[targetIdx];
  var isLast = (targetIdx >= GOAL - 1);
  if (!slot) { if (isLast) doClear(); else setTimeout(nextAnimal, 1100); return; }

  var sr = stage.getBoundingClientRect();
  var cr = card.getBoundingClientRect();
  var fromX = cr.left - sr.left + cr.width / 2;
  var fromY = cr.top  - sr.top  + cr.height / 2;
  var tr = slot.getBoundingClientRect();
  var toX = tr.left - sr.left + tr.width / 2;
  var toY = tr.top  - sr.top  + tr.height / 2;

  var fly = document.createElement('img');
  fly.src = 'images/star.png';
  fly.className = 'star-fly';
  fly.style.left = fromX + 'px';
  fly.style.top  = fromY + 'px';
  fly.style.transform = 'translate(-50%,-50%) scale(.3)';
  fly.style.opacity = '0';
  stage.appendChild(fly);

  // ① カードの上でピコッと出す
  requestAnimationFrame(function () {
    fly.style.transition = 'transform .18s ease-out, opacity .18s ease-out';
    fly.style.transform = 'translate(-50%,-50%) scale(1.1)';
    fly.style.opacity = '1';
  });
  // ② お掃除屋さんの頭の上のトレイへ飛ぶ
  setTimeout(function () {
    fly.style.transition = 'left .55s cubic-bezier(.3,.1,.3,1), top .55s cubic-bezier(.3,.1,.3,1), transform .55s ease-in';
    fly.style.left = toX + 'px';
    fly.style.top  = toY + 'px';
    fly.style.transform = 'translate(-50%,-50%) scale(1)';
  }, 220);
  // ③ トレイに収まる＝点灯（5個目ならクリア、まだなら次のどうぶつへ）
  setTimeout(function () {
    if (fly.parentNode) fly.parentNode.removeChild(fly);
    slot.classList.add('got');
    if (isLast) doClear();
    else setTimeout(nextAnimal, 300);
  }, 820);
}

/* ---- クリア！＝お祝いして「タイトルに戻る」（終わり） ----------------
   子どもは終わりが無いと止まれない。星5個でクリア→お祝い→タイトルへ。
   クリア音はケーキ完成と同じ finish。次は「タップでスタート」からまた最初。 */
function doClear() {
  cleared = true;
  se('gameclear_cute');               // クリアの豪華音（ポケットサウンド様）
  document.getElementById('clear').classList.add('show');
  var burst = setInterval(sparkleBurst, 240);
  setTimeout(function () {
    clearInterval(burst);
    document.getElementById('clear').classList.remove('show');
    resetGame();
    document.getElementById('title').classList.remove('hidden');   // タイトルへ戻る
  }, 3200);
}

/* 最初の状態に戻す（次のタイトルタップで再スタートできるように） */
function resetGame() {
  score = 0; stars = 0; cleared = false;
  scoreEl.textContent = '✨ 0';
  for (var i = 0; i < starEls.length; i++) starEls[i].classList.remove('got');
  ctx.clearRect(0, 0, cv.width, cv.height);
  animalIdx = -1; canClean = false;
  started = false;                    // タイトルのタップでまた最初から
}

/* ---- 次の どうぶつ（10枚をシャッフルの袋からランダムに） -------------
   袋に全どうぶつを入れて混ぜ、1枚ずつ引く。引き切ったらまた混ぜる。
   ＝ただの乱数より公平（10枚まんべんなく出る・直前と同じは出さない）。 */
var animalBag = [];
function refillBag() {
  animalBag = [];
  for (var i = 0; i < ANIMALS.length; i++) animalBag.push(i);
  for (var k = animalBag.length - 1; k > 0; k--) {        // Fisher-Yates シャッフル
    var j = Math.floor(Math.random() * (k + 1));
    var t = animalBag[k]; animalBag[k] = animalBag[j]; animalBag[j] = t;
  }
}
function pickAnimal() {
  if (ANIMALS.length <= 1) return 0;
  if (!animalBag.length) refillBag();
  // 末尾(これから引く札)が直前と同じなら、一つ手前と入れ替えて連続を防ぐ
  var last = animalBag.length - 1;
  if (animalBag[last] === animalIdx && last > 0) {
    var t = animalBag[last]; animalBag[last] = animalBag[last - 1]; animalBag[last - 1] = t;
  }
  return animalBag.pop();
}

function nextAnimal() {
  card.classList.add('swap');               // ふわっと消す
  setTimeout(function () {
    animalIdx = pickAnimal();               // ランダムに次の1枚
    animal.src = ANIMALS[animalIdx];
    var go = function () {
      paintDirt();                          // 新しいよごれをかぶせる
      card.classList.remove('swap');        // ふわっと現れる
      canClean = true;
    };
    if (animal.complete && animal.naturalWidth) go();
    else animal.onload = go;
  }, 360);
}

/* ---- 演出：キラキラ（完成の瞬間にカードのまわりへ） ----------------- */
var SPARK_COLORS = ['#ffd24d', '#ff7eb6', '#7ed0ff', '#9cff9c', '#fff2a8'];
function sparkleBurst() {
  var r = card.getBoundingClientRect();
  var sr = stage.getBoundingClientRect();
  var cx = r.left - sr.left + r.width / 2;
  var cy = r.top - sr.top + r.height / 2;
  for (var i = 0; i < 16; i++) {
    var s = document.createElement('div');
    s.className = 'spark';
    s.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    stage.appendChild(s);
    var ang = (Math.PI * 2 * i) / 16;
    var dist = r.width * 0.45 + Math.random() * 40;
    (function (node, dx, dy) {
      node.style.transition = 'transform .6s ease-out, opacity .6s ease-out';
      setTimeout(function () {
        node.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        node.style.opacity = '0';
      }, 10);
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 640);
    })(s, Math.cos(ang) * dist, Math.sin(ang) * dist);
  }
}

/* こすってる時にたまに出る小さなシャボンのキラッ（カード内・舞台座標へ換算） */
function bubbleAt(canvasX, canvasY) {
  var rect = cv.getBoundingClientRect();
  var sr = stage.getBoundingClientRect();
  var px = rect.left - sr.left + canvasX * (rect.width / cv.width);
  var py = rect.top - sr.top + canvasY * (rect.height / cv.height);
  var s = document.createElement('div');
  s.className = 'spark';
  s.style.background = 'rgba(255,255,255,0.9)';
  s.style.left = px + 'px';
  s.style.top = py + 'px';
  stage.appendChild(s);
  s.style.transition = 'transform .5s ease-out, opacity .5s ease-out';
  setTimeout(function () {
    s.style.transform = 'translate(0,-26px) scale(1.4)';
    s.style.opacity = '0';
  }, 10);
  setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 540);
}

/* ---- 効果音（shared/se/ の mp3 を鳴らす。全ゲーム共通の作法） --------
   - 1音1要素を使い回す（連打は鳴り直し＝3歳の遊びには自然）。
   - 最初のタッチで“鳴らす許可”をとる（ブラウザの自動再生制限の対策）。
   - 鳴らせない端末でも try/.catch で握りつぶして継続。 */
var SE_DIR = '../shared/se/';
var SE_USED = ['gameclear_cute', 'clean', 'click'];   // このゲームで使う音（クリア／1枚完了／ボタン）
var seBank = {};
function getSE(n) {
  if (!seBank[n]) { var a = new Audio(SE_DIR + n + '.mp3'); a.preload = 'auto'; seBank[n] = a; }
  return seBank[n];
}
function se(n) {
  try { var a = getSE(n); a.volume = (window.HTBSettings ? HTBSettings.seVolume() : 1);
        a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function(){}); }
  catch (e) { /* 音が出なくてもゲームは続く */ }
}
var seUnlocked = false;
function unlockSE() {
  if (seUnlocked) return; seUnlocked = true;
  for (var i = 0; i < SE_USED.length; i++) (function (a) {
    try {
      a.muted = true;
      var p = a.play();
      var done = function () { try { a.pause(); a.currentTime = 0; } catch (e) {} a.muted = false; };
      if (p && p.then) p.then(done).catch(done); else done();
    } catch (e) {}
  })(getSE(SE_USED[i]));
}
document.addEventListener('touchstart', unlockSE, { once: true });
document.addEventListener('mousedown', unlockSE, { once: true });

/* ---- BGM（shared/bgm/ の mp3 をループ再生。全ゲーム共通の作法） --------
   - 1曲を loop 再生。最初のタッチで自動再生制限を解除して鳴らす。
   - 効果音より音量は控えめ（背景）。鳴らせない端末でもゲームは続く。 */
var BGM_DIR = '../shared/bgm/';
var BGM_NAME = 'araiguma';    // このページのBGM（shared/bgm/araiguma.mp3）
var BGM_VOL = 0.23;          // 効果音より控えめな背景（実機で調整した値）
var bgmAudio = null, bgmOn = false;
function startBGM() {
  if (bgmOn) return;
  try {
    if (!bgmAudio) {
      bgmAudio = new Audio(BGM_DIR + BGM_NAME + '.mp3');
      bgmAudio.loop = true; bgmAudio.preload = 'auto';
      bgmAudio.volume = (window.HTBSettings ? HTBSettings.bgmVolume() : BGM_VOL);
    }
    var p = bgmAudio.play();
    if (p && p.then) p.then(function(){ bgmOn = true; }).catch(function(){});
    else bgmOn = true;
  } catch (e) { /* BGMが鳴らなくてもゲームは続く */ }
}
document.addEventListener('touchstart', startBGM, { once: true });
document.addEventListener('mousedown', startBGM, { once: true });
startBGM();   // 読み込み時にまず再生を試す（ブラウザが許せば即・ダメなら最初のタップで）

/* ---- ボタンのクリック音（共通ボタン。効果音の音量・ミュートに従う）。
   もどる等“画面が変わる”ボタンは、音を聞かせてから少し遅らせて遷移する（音が切れない）。 ---- */
var NAV_DELAY = 140;                 // クリック音を鳴らしてから画面を変えるまでの待ち（ms）
document.addEventListener('click', function (e) {
  var nav = e.target.closest('#back, #t-back');
  if (nav && nav.getAttribute('href')) {                 // もどる＝別ページへ
    e.preventDefault();
    se('click');
    var href = nav.getAttribute('href');
    setTimeout(function () { window.location.href = href; }, NAV_DELAY);
    return;
  }
  if (e.target.closest('#gear, #title, #t-gear, #panel-close')) se('click');   // 画面はそのまま＝すぐ鳴らす
});

/* ---- 親用の調節パネル ------------------------------------------------ */
function buildPanel() {
  makeSeg('seg-wipe', 'wipe');
  document.getElementById('gear').addEventListener('click', function () {
    document.getElementById('panel').classList.add('open');
  });
  document.getElementById('panel-close').addEventListener('click', function () {
    document.getElementById('panel').classList.remove('open');
  });
}
function makeSeg(id, key) {
  var box = document.getElementById(id);
  box.innerHTML = '';
  for (var n = 1; n <= 5; n++) {
    (function (val) {
      var b = document.createElement('button');
      b.textContent = val;
      if (setting[key] === val) b.className = 'on';
      b.addEventListener('click', function () {
        setting[key] = val;
        var bs = box.getElementsByTagName('button');
        for (var k = 0; k < bs.length; k++) bs[k].className = '';
        b.className = 'on';
      });
      box.appendChild(b);
    })(n);
  }
}

/* ---- タイトル → はじめるで開始（各ゲーム共通） ---------------------- */
function bindTitle() {
  // タイトルのどこを押してもスタート（もどる・設定だけ除外）
  document.getElementById('title').addEventListener('click', function (e) {
    if (e.target.closest('#t-back, #t-gear')) return;
    document.getElementById('title').classList.add('hidden');
    if (!started) {
      started = true;
      sizeCard(parseFloat(stage.style.width), parseFloat(stage.style.height));
      nextAnimal();                 // 最初の動物＋よごれをセット
    }
  });
  document.getElementById('t-gear').addEventListener('click', function () {
    document.getElementById('panel').classList.add('open');
  });
}

/* ---- 起動（ゲームは待機。タイトルのはじめるで動き出す） -------------- */
buildStarTray();
buildPanel();
bindTitle();
layout();
</script>
