<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>はるひのおもちゃ箱</title>
<link rel="stylesheet" href="style.css">
<script src="shared/settings.js"></script>
</head>
<body>

<div id="stage">
  <img id="bg" src="images/title-bg.jpg" alt="はるひのおもちゃ箱">

  <!-- 隅のボタン -->
  <button id="settei" class="corner" aria-label="せってい">
    <img src="shared/images/btn-settei.png" alt="せってい">
  </button>
  <button id="owaru" class="corner" aria-label="おわる">
    <img src="images/btn-owaru.png" alt="おわる">
  </button>

  <!-- ゲームアイコンはJSで生成 -->
</div>

<!-- 親用の音設定パネル（設定ボタンで開く。BGMと効果音の音量＋ミュート） -->
<div id="panel">
  <div class="sheet">
    <h2>おとの せってい</h2>
    <div class="row">
      <span>おんがく（BGM）</span>
      <div class="seg" id="seg-bgm"></div>
      <button class="mute" id="mute-bgm"></button>
    </div>
    <div class="row">
      <span>こうかおん</span>
      <div class="seg" id="seg-se"></div>
      <button class="mute" id="mute-se"></button>
    </div>
    <button class="close" id="panel-close">とじる</button>
  </div>
</div>

<!-- バージョン表示（右下・控えめ。今入っているのがどの版か＝直したバグの管理用） -->
<div id="ver">v1.3</div>

<script>
/* =======================================================================
   はるひのおもちゃ箱 ・ タイトル画面
   - 背景の上に「設定／おわる」と「ゲームアイコン3つ」を％で重ねる。
   - アイコンは各ゲームのキャラ画像を借りる。まだ絵が無いゲームは仮アイコン。
   - 位置の微調整は下の ICONS / 舞台サイズ で。
   ======================================================================= */

/* 並び順：左からクマ・アザラシ・アライグマ。x/y は背景に対する％。
   imgX＝円の中でキャラを左右に寄せる％（＋で右へ）。絵によって左右の余白が違うので個別に補正。 */
var ICONS = [
  { label: 'クマさんキャッチ', img: 'kuma-catch/images/chara.png',
    href: 'kuma-catch/index.html', x: 12, y: 50, imgX: 22 },   // 絵が左寄り→右へ
  { label: 'アザラシたたき', img: 'azarashi-tataki/images/chara2.png',
    href: 'azarashi-tataki/index.html', x: 22, y: 83, imgX: 17 },
  { label: 'アライグマのふきふき', img: 'araiguma-fukifuki/images/cleaner.png',
    href: 'araiguma-fukifuki/index.html', x: 89, y: 62, imgX: 0 }
];

var stage = document.getElementById('stage');
var bg = document.getElementById('bg');
var ASPECT = 871 / 1400;   // bg読込で実寸比に更新

/* ---- 舞台寸法（絵を縦横比そのままで中央に） ---- */
function layout() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var w = vw, h = w * ASPECT;
  if (h > vh) { h = vh; w = h / ASPECT; }
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  stage.style.left = ((vw - w) / 2) + 'px';
  stage.style.top  = ((vh - h) / 2) + 'px';
}
window.addEventListener('resize', layout);
bg.onload = function(){ ASPECT = bg.naturalHeight / bg.naturalWidth; layout(); };

/* ---- ゲームアイコンを作る ---- */
function buildIcons() {
  for (var i = 0; i < ICONS.length; i++) {
    var it = ICONS[i];
    var a = document.createElement('a');
    a.className = 'icon';
    a.href = it.href;
    a.style.left = it.x + '%';
    a.style.top = it.y + '%';
    a.innerHTML =
      '<div class="disc">' +
        '<img alt="">' +
        '<div class="ph"><div class="q">？</div><div class="soon">じゅんびちゅう</div></div>' +
      '</div>' +
      '<div class="label">' + it.label + '</div>';

    (function (anchor, src, imgX) {
      var im = anchor.querySelector('.disc img');
      im.onerror = function(){ anchor.className = 'icon noimg'; im.style.display = 'none'; };
      im.style.transform = 'translateX(' + (imgX || 0) + '%)';   // 円の中でキャラを左右に寄せる
      im.src = src;   // 読めれば表示、ダメなら onerror で仮アイコンに
    })(a, it.img, it.imgX);

    stage.appendChild(a);
  }
}

/* ---- 隅ボタンの動作（設定＝音パネル／おわる） ---- */
document.getElementById('owaru').addEventListener('click', function(){
  /* 「おわる」。クリック音を聞かせてからアプリを終了する。
     APKでは Android 側の橋（HaruhiApp.exit）で本物のアプリ終了。
     橋が無いブラウザ等では window.close()（閉じられない端末もある）。 */
  setTimeout(function () {
    try {
      if (window.HaruhiApp && window.HaruhiApp.exit) { window.HaruhiApp.exit(); return; }
      window.close();
    } catch (e) {}
  }, NAV_DELAY);
});

/* ---- BGM（shared/bgm/ の mp3 をループ再生。全ゲーム共通の作法） --------
   - 箱もゲームと同じ src/ 直下なので shared/bgm/。1曲を loop 再生。
   - 最初のタッチで自動再生制限を解除して鳴らす。音量は控えめ（背景）。
   - 表紙はアイコンを押すとすぐ次のゲームへ飛ぶので、それまでの間や
     「もどる」で戻ってきた時に鳴る。鳴らせない端末でも何も壊れない。 */
var BGM_DIR = 'shared/bgm/';
var BGM_NAME = 'title';       // 表紙のBGM（shared/bgm/title.mp3）
var BGM_VOL = 0.23;          // 効果音より控えめな背景（実機で調整した値）
var bgmAudio = null, bgmOn = false;
function startBGM() {
  if (bgmOn) return;
  try {
    if (!bgmAudio) {
      bgmAudio = new Audio(BGM_DIR + BGM_NAME + '.mp3');
      bgmAudio.loop = true; bgmAudio.preload = 'auto';
      bgmAudio.volume = (window.HTBSettings ? HTBSettings.bgmVolume() : BGM_VOL);
    }
    var p = bgmAudio.play();
    if (p && p.then) p.then(function(){ bgmOn = true; }).catch(function(){});
    else bgmOn = true;
  } catch (e) { /* BGMが鳴らなくても表紙は動く */ }
}
document.addEventListener('touchstart', startBGM, { once: true });
document.addEventListener('mousedown', startBGM, { once: true });
startBGM();   // 読み込み時にまず再生を試す（ブラウザが許せば即・ダメなら最初のタップで）

/* ---- 親用の音設定パネル（BGM・効果音の音量 1〜5 ＋ ミュート） --------
   設定はすべて shared/settings.js が localStorage に保存し、各ゲームが読む。 */
function makeSeg(id, current, onPick) {
  var box = document.getElementById(id);
  box.innerHTML = '';
  for (var n = 1; n <= 5; n++) (function (val) {
    var b = document.createElement('button');
    b.textContent = val;
    if (current === val) b.className = 'on';
    b.addEventListener('click', function () {
      var bs = box.getElementsByTagName('button');
      for (var k = 0; k < bs.length; k++) bs[k].className = '';
      b.className = 'on';
      onPick(val);
    });
    box.appendChild(b);
  })(n);
}
function reflectMute(segId, btnId, muted) {
  document.getElementById(segId).className = 'seg' + (muted ? ' muted' : '');
  var btn = document.getElementById(btnId);
  btn.className = 'mute' + (muted ? ' on' : '');
  btn.textContent = muted ? '🔇 ミュートちゅう' : '🔊 おと あり';
}
/* 効果音プレイヤー（箱用）。名前ごとに1要素を使い回し、SE音量・ミュートに従う。 */
var seBank = {};
function playSE(name) {
  try {
    if (HTBSettings.seMuted()) return;
    if (!seBank[name]) { seBank[name] = new Audio('shared/se/' + name + '.mp3'); seBank[name].preload = 'auto'; }
    var a = seBank[name];
    a.volume = HTBSettings.seVolume();
    a.currentTime = 0;
    var p = a.play(); if (p && p.catch) p.catch(function(){});
  } catch (e) {}
}
/* パネルでSEを触った時の見本音（「ピコ」） */
function previewSE() { playSE('piko'); }
/* BGMの音量をその場で反映（パネルを開く＝設定ボタンを押した時点でBGMは鳴っている） */
function applyBgm() { if (bgmAudio) bgmAudio.volume = HTBSettings.bgmVolume(); }

function buildAudioPanel() {
  if (!window.HTBSettings) return;      // 設定モジュールが無ければ何もしない（安全）
  makeSeg('seg-bgm', HTBSettings.bgmLevel(), function (v) { HTBSettings.setBgmLevel(v); applyBgm(); });
  makeSeg('seg-se',  HTBSettings.seLevel(),  function (v) { HTBSettings.setSeLevel(v);  previewSE(); });
  reflectMute('seg-bgm', 'mute-bgm', HTBSettings.bgmMuted());
  reflectMute('seg-se',  'mute-se',  HTBSettings.seMuted());
  document.getElementById('mute-bgm').addEventListener('click', function () {
    var m = !HTBSettings.bgmMuted(); HTBSettings.setBgmMute(m);
    reflectMute('seg-bgm', 'mute-bgm', m); applyBgm();
  });
  document.getElementById('mute-se').addEventListener('click', function () {
    var m = !HTBSettings.seMuted(); HTBSettings.setSeMute(m);
    reflectMute('seg-se', 'mute-se', m); if (!m) previewSE();
  });
  document.getElementById('settei').addEventListener('click', function () {
    document.getElementById('panel').classList.add('open');
  });
  document.getElementById('panel-close').addEventListener('click', function () {
    document.getElementById('panel').classList.remove('open');
  });
}

/* ボタンのクリック音（設定/おわる/とじる/ゲームアイコン。SE音量・ミュートに従う）。
   ゲームへ飛ぶアイコンは、音を聞かせてから少し遅らせて遷移する（音が切れない）。 */
var NAV_DELAY = 140;                 // クリック音を鳴らしてから画面を変えるまでの待ち（ms）
document.addEventListener('click', function (e) {
  var icon = e.target.closest('a.icon');
  if (icon && icon.getAttribute('href')) {               // ゲームアイコン＝別ページへ
    e.preventDefault();
    playSE('click');
    var href = icon.getAttribute('href');
    setTimeout(function () { window.location.href = href; }, NAV_DELAY);
    return;
  }
  if (e.target.closest('#settei, #owaru, #panel-close')) playSE('click');
});

/* ---- 起動 ---- */
buildIcons();
buildAudioPanel();
layout();
</script>
</body>
</html>
