<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アザラシ叩き</title>
<link rel="stylesheet" href="style.css">
<script src="../shared/settings.js"></script>
</head>
<body>

<div id="stage">
  <div id="bg"></div>
  <!-- 穴の「前フチ（リップ）」：同じ背景の一部を前面に重ね、アザラシの足元を隠す。
       位置とサイズは layout() がpxで合わせる（CUTSで境目を調整）。 -->
  <div id="bg-mid"></div>      <!-- 中段リップ：上段アザラシの後ろ -->
  <div id="bg-bottom"></div>   <!-- 下段リップ：下段アザラシの後ろ（最前面） -->
  <!-- 穴・アザラシはJSで4つ生成する -->
  <a id="back" href="../index.html"><img src="../shared/images/btn-back.png" alt="もどる"></a>
  <div id="score">🐟 0</div>
  <div id="candytray"></div>          <!-- 集めた飴（20個でクリア）。スロットはJSで作る -->
  <button id="gear" aria-label="設定"><img src="../shared/images/btn-settei.png" alt="設定"></button>

  <div id="panel">
    <div class="sheet">
      <h2>設定</h2>
      <div class="row">
        <span>アザラシが帰る速さ</span>
        <div class="seg" id="seg-speed"></div>
      </div>
      <button class="close" id="panel-close">閉じる</button>
    </div>
  </div>

  <!-- 完成演出（飴20個でクリア。できたー！画像が動きながら出る） -->
  <div id="clear"><img class="clear-img" src="../shared/images/dekita.png" alt="できたー！"></div>

  <!-- タップした場所に振り下ろすハンマー（演出オプション） -->
  <div id="whack"><img src="images/hammer.png" alt=""></div>

  <!-- タイトル画面（各ゲーム共通：もどる・設定・はじめる） -->
  <div id="title">
    <img id="titlebg" src="images/title-bg.jpg" alt="アザラシたたき">
    <a id="t-back" href="../index.html"><img src="../shared/images/btn-back.png" alt="もどる"></a>
    <button id="t-gear" aria-label="ちょうせつ"><img src="../shared/images/btn-settei.png" alt="設定"></button>
    <div id="start-hint">タップで スタート</div>
  </div>
</div>

<script>
/* =======================================================================
   アザラシ叩き ― 骨組み v0.1
   - 中身はもぐら叩き。ただし「はるひ基準」に合わせる：
       罰なし・ゲームオーバーなし・スコアは増えるだけ・操作は触るだけ。
   - 流氷画像とアザラシPNGは後から差し込む（下の SEAL_IMG / BG_IMG）。
       画像が無くてもCSSの仮絵で遊べる状態にしてある。
   ======================================================================= */

/* ---- 差し替えポイント（絵が届いたらここを使う） ----------------------- */
var BG_IMG    = 'images/bg.jpg';       // 流氷＋穴4つの背景（無ければ仮の氷）
var SEAL_UP   = 'images/chara1.png';   // 出てきた普通顔（主役）
var SEAL_BONK = 'images/chara2.png';   // 触られた瞬間のPIKO顔（涙＋ハンマー込み）
var HAMMER    = 'images/hammer.png';   // タップ位置に振り下ろすカラフルハンマー

/* 空振り（どのアザラシにも当たらなかった）タップの時だけ、その場所に hammer.png を出す。
   ヒット時は出さない（chara2＝叩かれPIKO顔にハンマーが描き込まれていて二重になるため）。
   false にすると空振りでもハンマーを出さない（完全オフ）。 */
var SHOW_TAP_HAMMER = true;

/* 流氷画像のタテヨコ比（高さ÷幅）。bg.jpg読込時に実測値へ自動上書き。 */
var ASPECT = 861 / 1400;

/* 穴4つの位置（舞台に対する％）。bg.jpgの穴4つに合わせて実測。
   ※実機でズレてたら、この4行の数字だけ動かせば合う。 */
var HOLES = [
  { x: 44.5,  y: 13.8 },   // 左上
  { x: 67.75, y: 12.8 },   // 右上
  { x: 44.5,  y: 33.8 },   // 左下
  { x: 67.75, y: 34.8 }    // 右下
];

/* 「穴の前フチ（リップ）」の境目（舞台の高さに対する％）。
   背景をこの2本の線で 上／中／下 に分け、
   上段アザラシは中段リップの後ろ、下段アザラシは下段リップの後ろから出てくるように見せる。
   ※実機で見ながらこの2つを動かして“足元の隠れ具合”を合わせる。 */
var CUTS = { mid: 53.6, bottom: 72 };
/* ---------------------------------------------------------------------- */

var stage = document.getElementById('stage');
var bg    = document.getElementById('bg');
var scoreEl = document.getElementById('score');

var score = 0;
var seals = [];                 // 各穴のアザラシ要素
var holeBusy = [];              // 各穴が今アザラシを出しているか
var setting = { speed: 2 };     // 親の調節：かえるはやさ（1〜5）
var MAX_UP  = 2;                // 同時に出る最大数（固定。設定からは外した）
var tapHitSeal = false;         // 今のタップがアザラシに当たったか（空振り判定用）

var GOAL = 20;                  // 飴を何個集めたらクリアか
var candies = 0;                // 集めた飴の数
var trayEls = [];               // 飴トレイのスロット
var cleared = false;            // クリア演出中はtrue（タップ無反応に）

/* ---- 画像のあるなしを判定（あれば本物・無ければ仮絵のまま） ---------- */
(function detectAssets() {
  var bgImg = new Image();
  bgImg.onload = function () {
    document.body.classList.add('has-bg');
    bg.style.backgroundImage = 'url("' + BG_IMG + '")';
    ASPECT = bgImg.naturalHeight / bgImg.naturalWidth;  // 実寸比に合わせる
    layout();
  };
  bgImg.src = BG_IMG;

  // 普通顔が読めたら本物アザラシに切替（背景URLはstyle.cssのクラスで指定）。
  var sImg = new Image();
  sImg.onload = function () { document.body.classList.add('has-seal-img'); };
  sImg.src = SEAL_UP;

  // PIKO顔を先読み（初回ヒットで一瞬でも欠けないように）。
  var bImg = new Image();
  bImg.src = SEAL_BONK;
})();

/* ---- 穴とアザラシを4つ作る ------------------------------------------- */
function buildHoles() {
  for (var i = 0; i < HOLES.length; i++) {
    var h = HOLES[i];

    var hole = document.createElement('div');
    hole.className = 'hole';
    hole.style.left = h.x + '%';
    hole.style.top  = h.y + '%';
    stage.appendChild(hole);

    var seal = document.createElement('div');
    seal.className = 'seal';
    seal.style.left = h.x + '%';
    seal.style.top  = h.y + '%';
    seal.innerHTML =
      '<div class="seal-img"></div>' +
      '<div class="seal-face">' +
        '<div class="eye l"></div><div class="eye r"></div>' +
        '<div class="nose"></div><div class="whisker"></div>' +
      '</div>';

    (function (idx, el) {
      var hit = function (ev) {
        ev.preventDefault();
        if (!el.classList.contains('up')) return;   // 出てる時だけ反応
        catchSeal(idx, el);
      };
      el.addEventListener('touchstart', hit, { passive: false });
      el.addEventListener('mousedown', hit);
    })(i, seal);

    // 上段(i<2)＝中段リップの後ろ(z2)／下段(i>=2)＝下段リップの後ろ(z4)
    seal.style.zIndex = (i < 2) ? 2 : 4;

    stage.appendChild(seal);
    seals.push(seal);
    holeBusy.push(false);
  }
}

/* ---- アザラシを出す／引っ込める ------------------------------------- */
function popUp(idx) {
  if (holeBusy[idx]) return;
  holeBusy[idx] = true;
  var el = seals[idx];
  el.classList.remove('bonk');
  el.classList.add('up');

  // 出ている時間（はやさが上がるほど短い）
  var stay = 1700 - (setting.speed - 1) * 260;   // speed1:1700ms 〜 speed5:660ms
  el._timer = setTimeout(function () {
    if (el.classList.contains('up')) duckDown(idx);   // 触られず引っ込む＝罰なし
  }, stay);
}

function duckDown(idx) {
  var el = seals[idx];
  el.classList.remove('up');
  el.classList.remove('bonk');
  clearTimeout(el._timer);
  holeBusy[idx] = false;
}

/* ---- 触れた！＝飴を1つGET・キラキラ・ポンッ ------------------------- */
function catchSeal(idx, el) {
  if (cleared || candies >= GOAL) return;   // クリア演出中・集め終わりは無反応
  tapHitSeal = true;                  // ヒット＝この後の舞台ハンマー処理をスキップさせる印
  el.classList.add('bonk');           // CSSで画像がPIKO顔(chara2)へ＋きゅっと縮む
  score += 1;
  scoreEl.textContent = '🐟 ' + score;
  flyCandy(el);                       // 叩いた場所に飴が出て→上のトレイへ飛ぶ（着いたら点灯＆クリア判定）
  sparkle(el);
  se('piko');                         // ハンマーがヒットした音
  setTimeout(function () { duckDown(idx); }, 320);   // PIKO顔を見せてから引っ込む
}

/* ---- 飴トレイ（10個×2段＝20個でクリア） ----------------------------- */
function buildTray() {
  var tray = document.getElementById('candytray');
  tray.innerHTML = '';
  trayEls = [];
  for (var i = 0; i < GOAL; i++) {
    var c = document.createElement('div');
    c.className = 'cslot';
    c.innerHTML = '<img src="images/candy.png" alt="">';
    tray.appendChild(c);
    trayEls.push(c);
  }
}

/* 叩いた場所に飴がピコッと出て、上のトレイへ飛んで収まる演出。
   着地でスロットが点灯。最後（20個目）が収まったらクリア。 */
function flyCandy(sealEl) {
  var targetIdx = candies;            // これから埋めるスロット
  candies += 1;                       // 先に数える（連打でも別スロットへ）
  var slot = trayEls[targetIdx];
  if (!slot) { if (targetIdx >= GOAL - 1) doClear(); return; }

  var sr = stage.getBoundingClientRect();
  var r  = sealEl.getBoundingClientRect();
  var fromX = r.left - sr.left + r.width / 2;
  var fromY = r.top  - sr.top  + r.height * 0.34;   // アザラシの顔あたり
  var tr = slot.getBoundingClientRect();
  var toX = tr.left - sr.left + tr.width / 2;
  var toY = tr.top  - sr.top  + tr.height / 2;

  var fly = document.createElement('img');
  fly.src = 'images/candy.png';
  fly.className = 'candy-fly';
  fly.style.left = fromX + 'px';
  fly.style.top  = fromY + 'px';
  fly.style.transform = 'translate(-50%,-50%) scale(.2)';
  fly.style.opacity = '0';
  stage.appendChild(fly);

  // ① 叩いた場所でピコッと出す
  requestAnimationFrame(function () {
    fly.style.transition = 'transform .16s ease-out, opacity .16s ease-out';
    fly.style.transform = 'translate(-50%,-50%) scale(1.15)';
    fly.style.opacity = '1';
  });
  // ② 上のトレイへ飛ぶ
  setTimeout(function () {
    fly.style.transition = 'left .5s cubic-bezier(.3,.1,.3,1), top .5s cubic-bezier(.3,.1,.3,1), transform .5s ease-in, opacity .5s';
    fly.style.left = toX + 'px';
    fly.style.top  = toY + 'px';
    fly.style.transform = 'translate(-50%,-50%) scale(.6)';
  }, 200);
  // ③ トレイに収まる＝点灯（最後の1個ならクリアへ）
  setTimeout(function () {
    if (fly.parentNode) fly.parentNode.removeChild(fly);
    slot.classList.add('got');
    if (targetIdx >= GOAL - 1) doClear();
  }, 770);
}

/* ---- クリア！＝お祝いして「タイトルに戻る」（終わり） ----------------
   子どもは終わりが無いと止まれない。飴20個でクリア→お祝い→タイトルへ。
   クリア音はケーキ完成と同じ finish。次は「タップでスタート」からまた最初。 */
function doClear() {
  cleared = true;
  if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
  for (var i = 0; i < seals.length; i++) duckDown(i);   // 出ているアザラシをしまう
  se('gameclear_cute');               // クリアの豪華音（ポケットサウンド様）
  document.getElementById('clear').classList.add('show');
  var burst = setInterval(function () { sparkleAt(50, 38); }, 180);
  setTimeout(function () {
    clearInterval(burst);
    document.getElementById('clear').classList.remove('show');
    resetGame();
    document.getElementById('title').classList.remove('hidden');   // タイトルへ戻る
  }, 3200);
}

/* 最初の状態に戻す（次のタイトルタップで再スタートできるように） */
function resetGame() {
  score = 0; candies = 0; cleared = false;
  scoreEl.textContent = '🐟 0';
  for (var i = 0; i < trayEls.length; i++) trayEls[i].classList.remove('got');
  for (var j = 0; j < seals.length; j++) duckDown(j);
  started = false;                    // タイトルのタップでまた最初から
}

/* ---- 出現ループ ------------------------------------------------------ */
function spawnTick() {
  var activeMax = MAX_UP;                         // 同時に出る最大数（固定）
  var active = 0, free = [];
  for (var i = 0; i < holeBusy.length; i++) {
    if (holeBusy[i]) active++; else free.push(i);
  }
  if (active < activeMax && free.length) {
    var pick = free[Math.floor(Math.random() * free.length)];
    popUp(pick);
  }
}

/* 出現間隔（はやさが上がるほど短い）。
   ＝「出る頻度」の基準。値を大きくするほど“まばら”に出る（ゆったり）。
   ※2026-06-27：基準を倍にして頻度を半分にした（はやさ＝出てる長さはそのまま）。 */
function spawnInterval() {
  return 1800 - (setting.speed - 1) * 240;       // speed1:1800ms 〜 speed5:840ms
}
var spawnTimer = null;
function restartSpawnLoop() {
  if (spawnTimer) clearInterval(spawnTimer);
  spawnTimer = setInterval(spawnTick, spawnInterval());
}

/* ---- 演出：キラキラ -------------------------------------------------- */
var SPARK_COLORS = ['#ffd24d', '#ff7eb6', '#7ed0ff', '#9cff9c', '#fff2a8'];
function sparkle(el) {
  var r = el.getBoundingClientRect();
  var sr = stage.getBoundingClientRect();
  var cx = r.left - sr.left + r.width / 2;
  var cy = r.top - sr.top + r.height / 2;
  for (var i = 0; i < 10; i++) {
    var s = document.createElement('div');
    s.className = 'spark';
    s.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    stage.appendChild(s);
    var ang = (Math.PI * 2 * i) / 10;
    var dist = 40 + Math.random() * 40;
    (function (node, dx, dy) {
      node.style.transition = 'transform .5s ease-out, opacity .5s ease-out';
      // 次フレームで飛ばす
      setTimeout(function () {
        node.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        node.style.opacity = '0';
      }, 10);
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 540);
    })(s, Math.cos(ang) * dist, Math.sin(ang) * dist);
  }
}

/* 画面の％位置でキラキラ（クリア演出用） */
function sparkleAt(xPct, yPct) {
  var sr = stage.getBoundingClientRect();
  var cx = sr.width * xPct / 100, cy = sr.height * yPct / 100;
  for (var i = 0; i < 12; i++) {
    var s = document.createElement('div');
    s.className = 'spark';
    s.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    stage.appendChild(s);
    var ang = (Math.PI * 2 * i) / 12;
    var dist = 60 + Math.random() * 60;
    (function (node, dx, dy) {
      node.style.transition = 'transform .6s ease-out, opacity .6s ease-out';
      setTimeout(function () {
        node.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        node.style.opacity = '0';
      }, 10);
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 640);
    })(s, Math.cos(ang) * dist, Math.sin(ang) * dist);
  }
}

/* ---- 効果音（shared/se/ の mp3 を鳴らす。全ゲーム共通の作法） --------
   - 1音1要素を使い回す（連打は鳴り直し＝3歳の遊びには自然）。
   - 最初のタッチで“鳴らす許可”をとる（ブラウザの自動再生制限の対策）。
   - 鳴らせない端末でも try/.catch で握りつぶして継続。 */
var SE_DIR = '../shared/se/';
var SE_USED = ['piko', 'karaburi', 'click', 'gameclear_cute'];  // このゲームで使う音（ヒット／空振り／ボタン／クリア）
var seBank = {};
function getSE(n) {
  if (!seBank[n]) { var a = new Audio(SE_DIR + n + '.mp3'); a.preload = 'auto'; seBank[n] = a; }
  return seBank[n];
}
function se(n) {
  try { var a = getSE(n); a.volume = (window.HTBSettings ? HTBSettings.seVolume() : 1);
        a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function(){}); }
  catch (e) { /* 音が出なくてもゲームは続く */ }
}
var seUnlocked = false;
function unlockSE() {
  if (seUnlocked) return; seUnlocked = true;
  for (var i = 0; i < SE_USED.length; i++) (function (a) {
    try {
      a.muted = true;
      var p = a.play();
      var done = function () { try { a.pause(); a.currentTime = 0; } catch (e) {} a.muted = false; };
      if (p && p.then) p.then(done).catch(done); else done();
    } catch (e) {}
  })(getSE(SE_USED[i]));
}
document.addEventListener('touchstart', unlockSE, { once: true });
document.addEventListener('mousedown', unlockSE, { once: true });

/* ---- BGM（shared/bgm/ の mp3 をループ再生。全ゲーム共通の作法） --------
   - 1曲を loop 再生。最初のタッチで自動再生制限を解除して鳴らす。
   - 効果音より音量は控えめ（背景）。鳴らせない端末でもゲームは続く。 */
var BGM_DIR = '../shared/bgm/';
var BGM_NAME = 'azarashi';    // このページのBGM（shared/bgm/azarashi.mp3）
var BGM_VOL = 0.23;          // 効果音より控えめな背景（実機で調整した値）
var bgmAudio = null, bgmOn = false;
function startBGM() {
  if (bgmOn) return;
  try {
    if (!bgmAudio) {
      bgmAudio = new Audio(BGM_DIR + BGM_NAME + '.mp3');
      bgmAudio.loop = true; bgmAudio.preload = 'auto';
      bgmAudio.volume = (window.HTBSettings ? HTBSettings.bgmVolume() : BGM_VOL);
    }
    var p = bgmAudio.play();
    if (p && p.then) p.then(function(){ bgmOn = true; }).catch(function(){});
    else bgmOn = true;
  } catch (e) { /* BGMが鳴らなくてもゲームは続く */ }
}
document.addEventListener('touchstart', startBGM, { once: true });
document.addEventListener('mousedown', startBGM, { once: true });
startBGM();   // 読み込み時にまず再生を試す（ブラウザが許せば即・ダメなら最初のタップで）

/* ---- ボタンのクリック音（共通ボタン。効果音の音量・ミュートに従う）。
   もどる等“画面が変わる”ボタンは、音を聞かせてから少し遅らせて遷移する（音が切れない）。 ---- */
var NAV_DELAY = 140;                 // クリック音を鳴らしてから画面を変えるまでの待ち（ms）
document.addEventListener('click', function (e) {
  var nav = e.target.closest('#back, #t-back');
  if (nav && nav.getAttribute('href')) {                 // もどる＝別ページへ
    e.preventDefault();
    se('click');
    var href = nav.getAttribute('href');
    setTimeout(function () { window.location.href = href; }, NAV_DELAY);
    return;
  }
  if (e.target.closest('#gear, #title, #t-gear, #panel-close')) se('click');   // 画面はそのまま＝すぐ鳴らす
});

/* ---- 舞台の寸法を画面に合わせる（aspect-ratio非対応端末でもOK） ------ */
function layout() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var w = vw, h = w * ASPECT;
  if (h > vh) { h = vh; w = h / ASPECT; }
  if (w > 1200) { w = 1200; h = w * ASPECT; }     // 最大幅1200pxで中央寄せ（横長の流氷に合わせ）
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  stage.style.left = ((vw - w) / 2) + 'px';
  stage.style.top  = ((vh - h) / 2) + 'px';
  positionBands(w, h);
}
window.addEventListener('resize', layout);

/* 「前フチ（リップ）」2枚を、フル背景の同じ場所にpxでぴたっと重ねる。
   背景画像を舞台フルサイズで描き、上に−offsetだけずらして該当スライスだけ見せる。 */
function positionBands(w, h) {
  var mid = document.getElementById('bg-mid');
  var bot = document.getElementById('bg-bottom');
  if (!mid || !bot) return;
  var midTop = h * CUTS.mid / 100;
  var botTop = h * CUTS.bottom / 100;
  // 中段リップ：CUTS.mid 〜 CUTS.bottom の帯
  mid.style.top    = midTop + 'px';
  mid.style.height = (botTop - midTop) + 'px';
  mid.style.backgroundSize     = w + 'px ' + h + 'px';
  mid.style.backgroundPosition = '0px ' + (-midTop) + 'px';
  // 下段リップ：CUTS.bottom 〜 下端の帯
  bot.style.top    = botTop + 'px';
  bot.style.height = (h - botTop) + 'px';
  bot.style.backgroundSize     = w + 'px ' + h + 'px';
  bot.style.backgroundPosition = '0px ' + (-botTop) + 'px';
}

/* ---- 親用の調節パネル ------------------------------------------------ */
function buildPanel() {
  makeSeg('seg-speed', 'speed');
  document.getElementById('gear').addEventListener('click', function () {
    document.getElementById('panel').classList.add('open');
  });
  document.getElementById('panel-close').addEventListener('click', function () {
    document.getElementById('panel').classList.remove('open');
  });
}
function makeSeg(id, key) {
  var box = document.getElementById(id);
  box.innerHTML = '';
  for (var n = 1; n <= 5; n++) {
    (function (val) {
      var b = document.createElement('button');
      b.textContent = val;
      if (setting[key] === val) b.className = 'on';
      b.addEventListener('click', function () {
        setting[key] = val;
        var bs = box.getElementsByTagName('button');
        for (var k = 0; k < bs.length; k++) bs[k].className = '';
        b.className = 'on';
        restartSpawnLoop();
      });
      box.appendChild(b);
    })(n);
  }
}

/* ---- タップ位置にハンマーを振り下ろす演出（オプション・2番） -------- */
var whackEl = null;
function showWhack(clientX, clientY) {
  // 直前のタップがアザラシに当たっていたら、ここは空振りでないので何もしない（印だけ消す）。
  if (tapHitSeal) { tapHitSeal = false; return; }
  if (!started) return;                                                  // ゲーム中だけ
  if (document.getElementById('panel').classList.contains('open')) return; // 設定を開いてる時は無視
  se('karaburi');                       // 空振りの音（ハンマー表示のON/OFFに関係なく鳴らす）
  if (!SHOW_TAP_HAMMER) return;         // ハンマー演出オフなら音だけ鳴らして終わり
  if (!whackEl) whackEl = document.getElementById('whack');
  var sr = stage.getBoundingClientRect();
  whackEl.style.left = (clientX - sr.left) + 'px';
  whackEl.style.top  = (clientY - sr.top)  + 'px';
  whackEl.classList.remove('go');
  void whackEl.offsetWidth;            // リフローでアニメを毎回やり直す
  whackEl.classList.add('go');
}
function bindWhack() {
  var onDown = function (ev) {
    // 設定・もどる等のボタンを押した時は「空振り」にしない（ハンマーも空振り音も出さない）
    if (ev.target && ev.target.closest && ev.target.closest('button, a')) return;
    var p = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    if (p.clientX == null) return;
    showWhack(p.clientX, p.clientY);
  };
  stage.addEventListener('touchstart', onDown, { passive: true });
  stage.addEventListener('mousedown', onDown);
}

/* ---- タイトル → はじめるで開始（各ゲーム共通） ---------------------- */
var started = false;
function bindTitle() {
  // タイトルのどこを押してもスタート（もどる・設定だけ除外）
  document.getElementById('title').addEventListener('click', function (e) {
    if (e.target.closest('#t-back, #t-gear')) return;
    document.getElementById('title').classList.add('hidden');
    if (!started) { started = true; restartSpawnLoop(); }
  });
  document.getElementById('t-gear').addEventListener('click', function () {
    document.getElementById('panel').classList.add('open');
  });
}

/* ---- 起動（ゲームは待機。タイトルのはじめるで動き出す） -------------- */
buildHoles();
buildTray();
buildPanel();
bindTitle();
bindWhack();
layout();
</script>
