<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://jo-komura.github.io/my-workspace/land-design/src/images/favicon.png">
<title>ページが見つかりません｜ランドデザイン</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<!-- 404は「どんな壊れたURLでも確実に表示される」ことが命なので、style.cssに依存せず自己完結で書く -->
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#0d1b3e;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;text-align:center;padding:2rem}
  .nf-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:2.5rem;max-width:100%}
  .nf-logo-icon{height:clamp(70px,18vw,100px);width:auto}
  .nf-logo-text{display:flex;flex-direction:column;font-family:'Cormorant Garamond',serif;color:#fff;font-weight:600;line-height:1.04;white-space:nowrap}
  .nf-l1{font-size:clamp(1.5rem,6vw,2.1rem);letter-spacing:0.66em;margin-right:-0.66em}
  .nf-l2{font-size:clamp(1.5rem,6vw,2.1rem);letter-spacing:0.22em;margin-right:-0.22em}
  .nf-code{font-family:'Cormorant Garamond',serif;font-size:5.5rem;font-weight:600;color:#d4af6a;line-height:1;margin:0}
  .nf-rule{width:48px;height:2px;background:#b8964e;margin:1.2rem auto 1.4rem;opacity:.8}
  .nf-title{font-family:'Shippori Mincho B1',serif;font-size:1.5rem;font-weight:600;margin:0 0 1rem;letter-spacing:.06em}
  .nf-text{color:#cfd6e6;font-weight:300;line-height:2;margin:0 0 2.6rem}
  .nf-btn{display:inline-block;background:#d4af6a;color:#0d1b3e;text-decoration:none;font-weight:500;
          padding:.95rem 2.6rem;border-radius:4px;letter-spacing:.08em;transition:opacity .2s}
  .nf-btn:hover{opacity:.85}
</style>
<script defer src="https://jo-komura.github.io/my-workspace/land-design/src/analytics.js"></script>
</head>
<body>
  <div class="nf-logo">
    <img class="nf-logo-icon" src="https://jo-komura.github.io/my-workspace/land-design/src/images/logo-icon.png" alt="株式会社ランドデザイン">
    <span class="nf-logo-text"><span class="nf-l1">LAND</span><span class="nf-l2">DESIGN</span></span>
  </div>
  <p class="nf-code">404</p>
  <div class="nf-rule"></div>
  <h1 class="nf-title">ページが見つかりません</h1>
  <p class="nf-text">お探しのページは移動または削除された可能性があります。<br>お手数ですが、トップページからお探しください。</p>
  <a class="nf-btn" href="https://jo-komura.github.io/my-workspace/land-design/src/">トップページへ戻る</a>
</body>
</html>
